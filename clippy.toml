# Every process an agent or a site controls starts in the sandbox (`SandboxSpec::command`). A
# spawn that runs outside on purpose says why with `#[allow(clippy::disallowed_methods)]` and a
# one-line reason (the inventory: `crates/server/src/sandbox/mod.rs`).
disallowed-methods = [
    { path = "std::process::Command::new", reason = "start it with `SandboxSpec::command`, or allow it with the reason it runs outside" },
    { path = "tokio::process::Command::new", reason = "start it with `SandboxSpec::command`, or allow it with the reason it runs outside" },
    { path = "portable_pty::CommandBuilder::new", reason = "a terminal starts in the sandbox (`SandboxSpec::wrap`); allow it with the reason" },
]
