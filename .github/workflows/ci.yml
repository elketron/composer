name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: 3.47.7

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The action tests run real recipes; without just they are skipped.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: dart-lang/setup-dart@v1
      - name: Dart models are up to date with crates/protocol
        run: cargo run -q -p composer-protocol --features schema --bin dartgen -- --check
      - working-directory: apps/composer_protocol
        run: dart pub get && dart analyze --fatal-infos && dart test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/composer_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  # The desktop app (apps/desktop, its own Cargo workspace: gpui and CEF stay out of the rust job).
  desktop:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: System packages
        # the second line is what libcef.so loads when the tests run
        run: |
          pacman -Syu --noconfirm --needed git base-devel clang cmake rust pkgconf libxkbcommon libxkbcommon-x11 wayland vulkan-icd-loader fontconfig freetype2 libxcb \
            nss nspr alsa-lib at-spi2-core cairo pango dbus expat glib2 libcups mesa systemd-libs libx11 libxcomposite libxdamage libxext libxfixes libxrandr
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/composer/cef
          key: cef-156.0.15
      - name: fmt, clippy, test
        run: |
          git config --global --add safe.directory '*'
          apps/desktop/scripts/fetch-cef.sh
          scripts/ci.sh desktop
