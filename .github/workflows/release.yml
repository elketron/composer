name: release

# Push a tag like v0.2.0: builds the server and the apps, and publishes a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no release is published)'
        required: true
        default: '0.0.0-test'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: 3.47.7
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  server:
    runs-on: ubuntu-22.04 # an older glibc runs on more distributions (and in WSL)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p composer-cli
      - name: Package
        run: |
          v="${VERSION#v}"
          name="composer-$v-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/composer "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/*.tar.gz

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/composer_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The project's 8 GB Gradle heap plus the Kotlin daemon and the NDK build don't fit the
      # runner (it shuts down mid-build); the user-home properties win over the project's.
      - name: Gradle memory for the runner
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
          } >> ~/.gradle/gradle.properties
      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Build
        run: |
          v="${VERSION#v}"
          flutter build apk --release --build-name="${v%%-*}" --build-number="${{ github.run_number }}"
          mkdir -p ../../dist && cp build/app/outputs/flutter-apk/app-release.apk "../../dist/composer-app-$v-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  # WPE WebKit with WPEPlatform (for the micro apps) is too new for Ubuntu: build on Arch.
  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      # Flutter unpacks its downloads as root; don't try to restore the archives' owners
      # (fails in rootless containers, e.g. when trying this job locally with podman).
      TAR_OPTIONS: --no-same-owner
    steps:
      - name: System packages
        run: |
          pacman -Syu --noconfirm --needed git base-devel clang cmake ninja pkgconf unzip xz which \
            gtk3 libepoxy libsecret wpewebkit
      - uses: actions/checkout@v4
      - name: Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git /opt/flutter
          echo /opt/flutter/bin >> "$GITHUB_PATH"
      - name: Build
        run: |
          git config --global --add safe.directory '*'
          flutter config --no-analytics --enable-linux-desktop
          scripts/package-linux-app.sh "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: apps/composer_app
        shell: bash
        run: |
          v="${VERSION#v}"
          flutter build windows --release --build-name="${v%%-*}" --build-number="${{ github.run_number }}"
      - name: Installer
        working-directory: apps/composer_app
        shell: pwsh
        run: |
          $v = "$env:VERSION".TrimStart('v')
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" windows\installer.iss
          New-Item -ItemType Directory -Force ..\..\dist | Out-Null
          Copy-Item build\installer\*.exe ..\..\dist\
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
