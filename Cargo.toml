[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
composer-core = { path = "crates/core" }
composer-protocol = { path = "crates/protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
pulldown-cmark = { version = "0.13.4", default-features = false }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
walkdir = "2.5.0"
tempfile = "3.27.0"
