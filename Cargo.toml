[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
composer-core = { path = "crates/core" }
composer-protocol = { path = "crates/protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
pulldown-cmark = { version = "0.13.4", default-features = false }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
walkdir = "2.5.0"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7.20"
axum = { version = "0.8.9", features = ["ws"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
futures = "0.3.34"
toml = "1.1.8"
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7.4"
notify = "8"
tokio-tungstenite = "0.30.0"
async-trait = "0.1.92"
sha2 = "0.11.1"
chrono = "0.4.45"
rand = "0.9"
base64 = "0.22"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
