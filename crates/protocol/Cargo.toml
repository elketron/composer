[package]
name = "composer-protocol"
description = "Messages shared by the composer server, TUI and app sdk"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `cargo test -p composer-protocol --features ts` writes TS types to bindings/
ts = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ts-rs = { workspace = true, optional = true }
