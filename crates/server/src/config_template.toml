# composer settings. Every field is optional; these are the defaults.
# Saving this file applies it to the running server (`:reload` in the TUI does it too), except
# [provider], server.bind, agent.slots and attachments.max_mb: those need `composer serve` restarted.

[provider]
# An OpenAI-compatible API, including /v1 (llama.cpp's llama-server, vLLM, Ollama at
# http://127.0.0.1:11434/v1, a hosted provider...).
base_url = "http://127.0.0.1:8080/v1"
# Sent as a bearer token when set.
api_key = ""
# Empty: the first model listed by GET /models.
model = ""
# Images in tool results (an MCP server's screenshot) go to the model as images. false for a
# server that rejects images outside user messages.
tool_images = true
# OpenRouter: base_url = "https://openrouter.ai/api/v1" and your key. Sessions can use another of
# its models: `:model` in the TUI, Model… in the app's chat menu.

[system1]
# A small fast model that decides action approvals for you (typing into a terminal, background
# processes, MCP tools, outside agents' tool calls, recipe runs): approve, reject, or forward to you.
# Trust changes (a site's folder:, its mcp.toml, the policy pages) always come to you, and it never
# says `always`. It reads the request, your own recent messages in the session (never tool output
# or the agent's text) and the policy pages site://home/approvals.md and <site>/approvals.md, each
# only in a version you approved (you are asked when it first needs a new version). Each decision
# is a line in the chat. Any error, timeout or unclear answer forwards the request to you.
# Empty: off. With api = "systemone" it is only shown in logs.
model = ""
# How it is asked:
# "chat": chat completions, answering {"decision": approve|reject|forward, "reason": ...} (a
#   strict JSON schema, falling back to json_object, then none).
# "systemone": a decision model such as LiquidAI d1-2B served by llama-server, at
#   POST <base_url>/systemone. It writes no text: it answers one choice question with
#   probabilities, and the thresholds below turn them into approve, reject or forward. E.g.
#     model = "d1-2B"
#     api = "systemone"
#     base_url = "https://inferk.example/v1"
api = "chat"
# Empty: [provider]'s base_url (sharing its slots), and its api_key unless api_key is set.
base_url = ""
api_key = ""
# A decision that takes longer is forwarded to you.
timeout_secs = 15
# api = "chat" only. Sent as `reasoning_effort` (none, low, medium, high), like [agent]
# reasoning_effort: a decision needs little thought. Empty: not sent, the provider decides.
reasoning_effort = "low"
# api = "systemone" only: it approves only when it chooses approve with P(approve) at least
# approve_threshold, rejects only when it chooses reject with P(reject) at least reject_threshold;
# anything else comes to you. The chat line shows the probabilities: tune these on your own use.
approve_threshold = 0.9
reject_threshold = 0.9

[server]
# Keep it on localhost; reach it from other devices with `tailscale serve` (see `composer pair`).
bind = "127.0.0.1:7420"
# How this server introduces itself to the app; empty: the hostname.
name = ""

[agent]
# Model requests at once, across all sessions (your model server's parallelism).
slots = 2
# Tokens a turn may use before it stops: what the model writes plus what its steps bring in (tool
# results), not the context it started with. 0: no limit.
turn_tokens = 200000
# Model calls per turn before it stops, as well. 0: no limit.
max_steps = 0
# Prompt tokens at which a session is compacted.
compaction_threshold = 160000
# A recipe run is killed after this many seconds.
recipe_timeout_secs = 300
# How much models think: none, low, medium or high, sent as `reasoning_effort` (Strata, vLLM,
# llama.cpp's convention, OpenAI's reasoning models). An agent's `reasoning:` overrides it.
# Empty: not sent, the provider decides.
reasoning_effort = ""

[terminals]
# Output kept per terminal (for a client joining late, and for the agent to read), in KB.
scrollback_kb = 256

[desktop]
# This server's colour, `#rrggbb`, in the desktop and the phone (its dot and title bar); empty:
# one derived from the server's name, so servers are still told apart.
color = ""

[attachments]
# Largest upload, in MB.
max_mb = 20
# Images are shrunk to this long side (pixels) and re-encoded, which also drops EXIF (location).
image_max_edge = 1500
# Text and PDF text beyond this many KB is cut before it reaches the model.
inline_max_kb = 100

# wayai's live view, served to your other devices at `/view` behind the server's
# token (view only: nothing a device sends reaches the application). Without `url` it is taken from
# `[mcp.wayai]`'s `url` (same address, path /view). Loopback addresses only.
# wayai asks for a bearer token, which it keeps in a file: `bearer_file` names it (`~/` is your
# home). The proxy reads it for every request and sends `Authorization: Bearer <token>` to the
# viewer (never to the client). Without it here, `[mcp.wayai]`'s `bearer_file` is used when the
# viewer is at that server's address.
# [viewer]
# url = "http://127.0.0.1:7878/view"
# bearer_file = "~/.local/share/wayai/token"

# Your own web servers on this machine, shown on the desk (the agent's `show_page app://canvas/`)
# and served to your devices at `/apps/<name>/` behind the server's token: any request, event
# streams and WebSockets are forwarded; your token, composer's cookie and `Authorization` are not.
# Loopback addresses only (127.0.0.1, ::1, localhost). The app must use relative URLs (`api/x`,
# not `/api/x`). `title`: what the clients call it (empty: its name).
# [apps.canvas]
# url = "http://127.0.0.1:4477"
# title = "Canvas"

# MCP servers in every session: an agentic run gets all their tools (`github__get_issue`), a
# workflow run the ones `read_only` names (none by default); calls outside `allow` ask you first
# ("always" remembers the tool). `${VAR}` comes from composer's environment.
# A server only some sites need goes in that site's own `mcp.toml` instead (`[servers.<name>]`,
# the same fields): nothing in it starts until you approve the file, and again after each edit.
# A server can wake a session with `notifications/composer/event` (`{"session"?, "text", "data"?}`;
# each call it gets names its session in `_meta["composer/session"]`): see the README, MCP events.
# [mcp.github]
# command = "github-mcp-server"
# args = ["stdio"]
# env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}" }
# allow = ["get_*", "list_*", "search_*"]
# read_only = ["get_*", "list_*", "search_*"]
#
# [mcp.docs]
# url = "https://example.com/mcp"
# headers = { Authorization = "Bearer ${DOCS_TOKEN}" }
#
# An HTTP server whose token is in a file (wayai): `bearer_file` is read at every connect and
# sent as `Authorization: Bearer <token>`; a file that cannot be read fails the connect. An
# `Authorization` in `headers` wins.
# [mcp.wayai]
# url = "http://127.0.0.1:7878/mcp"
# bearer_file = "~/.local/share/wayai/token"
#
# An MCP bundle (`<home>/mcps/blender.mcpb`) is used by a site with `bundle = "blender"` in its
# `mcp.toml`. Named here it is a server in every session (`enabled = false`: only its settings).
# [mcp.blender]
# allow = ["get_*"]
# It writes in the folder `$COMPOSER_BUNDLE_STATE` names
# (`<home>/state/mcps/.run/blender/`), where a `uv` bundle's environment and cache also live.
# config = { api_key = "..." }   # the bundle's settings

# Webhooks: `POST /api/hooks/<name>` with `Authorization: Bearer <the hook's token>` starts a run
# and answers when it is done: `{"value": ...}` (and `"session"` when stored). Only this hook's
# token opens it; device and local tokens do not. `kind`: single_shot (one model call, the folder's
# instructions as its whole system prompt), workflow (reads, changes nothing, returns `finish`'s
# value) or agentic (every tool; returns the final answer). `prompt` is filled from the JSON body:
# `{{body}}` is all of it, `{{field}}` one field. `store = true` keeps the run as a session.
# [hooks.krea]
# token_file = "~/.config/composer/krea-hook-token"   # or token = "..."
# kind = "single_shot"
# site = "prompts"
# folder = "krea2_prompt_improver"
# prompt = "{{prompt}}"
# store = false
# timeout_secs = 300
# harness = "claude"   # an [acp.<name>] below runs it (agentic, store = true)

# Outside agents over the Agent Client Protocol (ACP): a session started with `harness = "<name>"`
# (agentic sessions only) runs on that agent instead of composer's own loop. Composer starts
# `command` with `args` and `env` (added to composer's own environment) in the session site's
# `folder:` (once you approved it) and hands it composer itself as its MCP server, so it has composer's tools. Its
# permission requests come to your clients as approvals.
# [acp.claude]
# command = "claude-agent-acp"
# args = []
# env = { ANTHROPIC_API_KEY = "..." }
