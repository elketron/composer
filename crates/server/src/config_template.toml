# composer settings. Every field is optional; these are the defaults.
# Saving this file applies it to the running server (`:reload` in the TUI does it too), except
# [provider], server.bind, agent.slots and attachments.max_mb: those need `composer serve` restarted.

[provider]
# An OpenAI-compatible API, including /v1 (llama.cpp's llama-server, vLLM, Ollama at
# http://127.0.0.1:11434/v1, a hosted provider...).
base_url = "http://127.0.0.1:8080/v1"
# Sent as a bearer token when set.
api_key = ""
# Empty: the first model listed by GET /models.
model = ""
# Images in tool results (an MCP server's screenshot) go to the model as images. false for a
# server that rejects images outside user messages.
tool_images = true
# OpenRouter: base_url = "https://openrouter.ai/api/v1" and your key. Sessions can use another of
# its models: `:model` in the TUI, Model… in the app's chat menu.

[system1]
# A fast model that decides workers' approvals (approve, deny, or ask you) in one call, instead
# of a turn of their orchestrator. Empty: off, the orchestrator decides.
model = ""
# Empty: the [provider]'s (sharing its slots), and its key unless api_key is set.
base_url = ""
api_key = ""
# How much it thinks before deciding (none, low, medium, high). Empty: not sent.
reasoning_effort = "low"

[server]
# Keep it on localhost; reach it from other devices with `tailscale serve` (see `composer pair`).
bind = "127.0.0.1:7420"
# How this server introduces itself to the app; empty: the hostname.
name = ""

[agent]
# Model requests at once, across all sessions (your model server's parallelism).
slots = 2
# Tokens a turn may use before it stops: what the model writes plus what its steps bring in (tool
# results), not the context it started with. A worker then waits for its orchestrator to continue
# or stop it. 0: no limit.
turn_tokens = 200000
# Model calls per turn before it stops, as well. 0: no limit.
max_steps = 0
# Prompt tokens at which a session is compacted.
compaction_threshold = 160000
# A recipe run is killed after this many seconds.
recipe_timeout_secs = 300
# Worker processes running at once.
max_workers = 1
# Memory a worker run and everything it starts may use ("50%" of RAM, "12G"; "": no cap). Each run
# gets its own systemd scope: past this it is killed there, not the server or your terminal, and
# what it leaves running (daemons too) is stopped when it ends. Without systemd: no cap.
worker_memory_max = "50%"
# How much models think: none, low, medium or high, sent as `reasoning_effort` (Strata, vLLM,
# llama.cpp's convention, OpenAI's reasoning models). An agent's `reasoning:` overrides it.
# Empty: not sent, the provider decides.
reasoning_effort = ""

[projects]
# Where your projects live. new_project creates folders here, and a project given by name
# (`:project composer`, `composer --project composer`, a ticket's `project:`) is a folder here.
dir = "~/Projects"

# Per project (a path, or a name in `dir`): which external harnesses its tickets may run on.
# Off unless listed here.
# [projects."~/Projects/composer"]
# external_harnesses = ["claude-code"]
# allowed_tools = ["Bash(cargo test:*)", "Bash(cargo clippy:*)"]
# Which models its tickets may use ("<harness>" = any of its models); empty: any.
# models = ["claude-code:sonnet", "composer"]
# Turn a harness off for a while without editing this: `composer harness <project> off`.

[reminders]
# When a reminder page with a due date but no time goes off (local time).
default_time = "09:00"

[claude_code]
# The Claude Code CLI, for tickets with `harness: claude-code` in projects that allow it.
# In the sandbox (the default) each workspace has its own ~/.claude (your CLAUDE.md, settings,
# skills, agents, commands and plugins are lent read-only) and runs log in with a token: run
# `claude setup-token`, then `composer claude-token` and paste it. The run gets it as
# CLAUDE_CODE_OAUTH_TOKEN (so its own tools can read it: it is the login it already uses).
# With [sandbox] enabled = false it runs on this machine's `claude auth login` instead.
command = "claude"
# --model; empty: the CLI's default.
model = ""
max_turns = 60
# A run is stopped after this long.
timeout_minutes = 60
# What it may do without asking. Projects can add to it.
allowed_tools = ["Read", "Edit", "Write", "Glob", "Grep", "mcp__composer", "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(git add:*)", "Bash(git commit:*)"]
# Anything else is asked of you (an approval in the worker's chat; "always" remembers it for the
# project, in state/tool_rules.json). false: denied without asking.
ask = true
# Folders it may read (Read, Glob, Grep) but never edit: dependency sources and model caches, so it
# can look up how a library really works. Missing ones are skipped. Only source folders: ~/.cargo
# itself can hold credentials.toml, ~/.cache/huggingface a token.
read_dirs = ["~/.cargo/registry/src", "~/.cargo/git/checkouts", "~/.rustup/toolchains", "~/.cache/huggingface/hub", "~/go/pkg/mod", "~/.pub-cache/hosted", "~/.pub-cache/git", "~/.nuget/packages", "~/.bun/install/cache", "~/.cache/uv", "~/.gradle/caches/modules-2/files-2.1", "~/.m2/repository"]

[terminals]
# A terminal nobody typed into or read for this long ends; showing its tab again starts a fresh
# shell in the same folder.
idle_hours = 24
# Output kept per terminal (for a client joining late, and for the agent to read), in KB.
scrollback_kb = 256
# Your shell config, lent read-only (a terminal's $HOME is otherwise empty; add what your shell's
# setup reads, plugins and themes included); keep secrets out of these files: the agent could
# read them too.
lend = ["~/.zshrc", "~/.zshenv", "~/.zprofile", "~/.p10k.zsh", "~/.oh-my-zsh", "~/.bashrc", "~/.profile", "~/.config/fish", "~/.config/starship.toml", "~/.config/nvim", "~/.local/share/nvim"]

[apps]
# Apps that are clients of this workspace: opened with its full access (sessions, approvals),
# like the TUI. Every other app gets a token of its own (it reads every page, writes only its own
# site, project and data). A site's own `client: true` only asks; it is listed here by you.
clients = ["chat"]

[desktop]
# This workspace's colour, `#rrggbb`, in the desktop and the phone (its dot and title bar); empty:
# one derived from the workspace's name, so its windows are still told apart.
color = ""

[sandbox]
# Every recipe, Claude Code run and stdio MCP server runs in a bwrap sandbox: its workspace's sites
# and its project read-write, these folders read-only, a private /tmp and an empty $HOME. Nothing of
# other workspaces, the library or composer's state/ is inside. Needs `bwrap` (bubblewrap); without
# it those spawns are refused. `enabled = false` runs them unsandboxed (your explicit choice).
enabled = true
system_dirs = ["/opt", "/sys", "/run/systemd/resolve"]
toolchains = ["~/.rustup", "~/.cargo/bin", "~/.bun/bin", "~/.local/bin"]
# Package caches, read-write and shared by every workspace.
caches = ["~/.cargo/registry", "~/.cargo/git", "~/.bun/install/cache", "~/.cache/uv"]
# More paths (a workspace's config.toml may set these too): binds_rw = ["~/Projects"] for a site
# whose recipes take any project; devices = ["/dev/dri"] for the GPU. Another workspace's projects
# inside a bind stay hidden.
binds_ro = []
binds_rw = []
devices = []

[attachments]
# Largest upload, in MB.
max_mb = 20
# Images are shrunk to this long side (pixels) and re-encoded, which also drops EXIF (location).
image_max_edge = 1500
# Text and PDF text beyond this many KB is cut before it reaches the model.
inline_max_kb = 100

# Apps the web's apps can launch on this machine's desktop: one [[launcher]] entry per
# launch button, and declaring an entry is its approval. The folder must be inside the
# projects directory (a project, or a folder inside one: the scoped slice you want the app
# to see; the directory itself counts too); the command runs as `command <args...> <folder>`, working in that folder. The
# apps ask `GET /api/launcher` and `POST /api/launcher/<name>`.
# [[launcher]]
# name = "blender-blockouts"
# command = "xterminal"
# folder = "myproject/blockouts"
# args = ["--class", "blender"]

# Applications a site's `app:` (its index.md frontmatter) starts when a session enters the site.
# The command lives here, not in the page, so declaring it is your approval. It is started
# through the `launch` tool of the MCP server `mcp` (default "wayai"), in the session's project.
# [applications.blender]
# command = "blender"
# args = []
# env = {}
# mcp = "wayai"

# wayai's live view, served to your other devices at `<workspace>/view` behind the workspace's
# token (view only: nothing a device sends reaches the application). Without `url` it is taken from
# `[mcp.wayai]`'s `url` (same address, path /view). Loopback addresses only.
# wayai asks for a bearer token, which it keeps in a file: `bearer_file` names it (`~/` is your
# home). The proxy reads it for every request and sends `Authorization: Bearer <token>` to the
# viewer (never to the client). Without it here, `[mcp.wayai]`'s `bearer_file` is used when the
# viewer is at that server's address.
# [viewer]
# url = "http://127.0.0.1:7878/view"
# bearer_file = "~/.local/share/wayai/token"

# MCP servers whose tools your agents may use. An agent gets a server's tools by listing them in
# its `tools:` (`github__*`, or one: `github__get_issue`); calls outside `allow` ask you first
# ("always" remembers the tool). `${VAR}` comes from composer's environment.
# A site (a workflow) whose index.md says `mcp: [github]` gives the server's tools to a session
# in it only when the server lists that site here: `sites = ["coding"]`. Without `sites` no site
# may grant it, whatever its page says (agents can write pages, not this file).
# [mcp.github]
# command = "github-mcp-server"
# args = ["stdio"]
# env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}" }
# allow = ["get_*", "list_*", "search_*"]
# sites = ["coding"]
# A stdio server runs in the workspace's sandbox (its sites, the toolchains, an empty `$HOME`);
# give it what else it needs, checked like `[sandbox]` binds:
# binds_ro = ["~/.config/github-mcp"]
# binds_rw = []
#
# [mcp.docs]
# url = "https://example.com/mcp"
# headers = { Authorization = "Bearer ${DOCS_TOKEN}" }
#
# An HTTP server whose token is in a file (wayai): `bearer_file` is read at every connect and
# sent as `Authorization: Bearer <token>`; a file that cannot be read fails the connect. An
# `Authorization` in `headers` wins. The file is outside every agent's sandbox unless you bind it.
# [mcp.wayai]
# url = "http://127.0.0.1:7878/mcp"
# bearer_file = "~/.local/share/wayai/token"
#
# An MCP bundle (`<home>/mcps/blender.mcpb`) is a server of its own name; its tools ask until allowed.
# [mcp.blender]
# allow = ["get_*"]
# sites = ["3d"]                 # the sites whose `mcp: [blender]` grants its tools
# Its unpacked code is read-only to it; it may write in the folder `$COMPOSER_BUNDLE_STATE` names
# (`<home>/state/mcps/.run/blender/`), where a `uv` bundle's environment and cache also live.
# config = { api_key = "..." }   # the bundle's settings
